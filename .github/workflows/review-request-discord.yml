name: Review Request → Discord

on:
  pull_request:
    types: [review_requested]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REQUESTER: ${{ github.actor }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          jq -n \
            --arg t "🔁 리뷰 요청: #$PR_NUM $PR_TITLE" \
            --arg d "$REQUESTER 님이 $REVIEWER 님에게 리뷰를 요청했어요" \
            --arg u "$PR_URL" \
            '{embeds:[{title:$t, description:$d, url:$u, color:16753920}]}' \
          | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK"